server:
  port: 8090

spring:
  application:
    name: control-center
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: control-center-live-tracker
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

services:
  api-gateway:
    url: ${API_GATEWAY_URL:http://localhost:8080}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8085}
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8088}
  aws-emulator:
    url: ${AWS_EMULATOR_URL:http://localhost:4566}
  kafka:
    address: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  redis:
    address: ${REDIS_ADDRESS:${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
  order-db:
    address: ${ORDER_DB_ADDRESS:${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5432}}
  product-db:
    address: ${PRODUCT_DB_ADDRESS:${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:5433}}
  payment-db:
    address: ${PAYMENT_DB_ADDRESS:${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5434}}
