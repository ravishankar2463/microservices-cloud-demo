server:
  port: 0

spring:
  application:
    name: order-service-test
  datasource:
    url: jdbc:h2:mem:ordertestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

aws:
  endpoint: http://localhost:4566
  region: us-east-1
  emulator-mode: true
