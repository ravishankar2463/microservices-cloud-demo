apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microservices-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: REDIS_PORT
            - name: AWS_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: AWS_ENDPOINT_URL
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: microservices-demo
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
