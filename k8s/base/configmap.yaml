apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices-demo
data:
  AWS_ENDPOINT_URL: "http://aws-emulator.microservices-demo.svc.cluster.local:4566"
  AWS_REGION: "us-east-1"
  SPRING_PROFILES_ACTIVE: "k8s"
  REDIS_HOST: "inventory-redis.microservices-demo.svc.cluster.local"
  REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.microservices-demo.svc.cluster.local:9092"
  ORDER_DB_HOST: "order-db.microservices-demo.svc.cluster.local"
  ORDER_DB_PORT: "5432"
  ORDER_DB_NAME: "order_db"
