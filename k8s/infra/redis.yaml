apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-redis
  namespace: microservices-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-redis
  template:
    metadata:
      labels:
        app: inventory-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-redis
  namespace: microservices-demo
spec:
  selector:
    app: inventory-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
