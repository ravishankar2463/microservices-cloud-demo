apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-config
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
data:
  AWS_ENDPOINT_URL: {{ .Values.global.awsEndpointUrl | quote }}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.kafkaBootstrapServers | quote }}
  SPRING_DATA_REDIS_HOST: {{ .Values.global.redisHost | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.global.redisPort | quote }}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: {{ .Values.global.otelExporterEndpoint | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
