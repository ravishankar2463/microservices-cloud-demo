apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: 8080
      name: http
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app: order-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.orderService.port }}
      targetPort: 8081
      name: http
  selector:
    app: order-service
---
